name: Build All-Download (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule publication a la fois : les boutons pointent toujours
# vers la derniere Release ayant passe TOUS les tests.
concurrency:
  group: all-download-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Tester et compiler All-Download sous Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pythonnet==3.2.1 pyinstaller==6.22.3

      - name: Verifier la syntaxe
        run: python -m py_compile yt_app.py

      - name: Tester le routage et la preservation des medias
        run: python -m unittest discover -s tests -v

      - name: Construire la version en dossier sans UPX
        run: python -m PyInstaller --clean --noconfirm All_Media_Download.spec

      - name: Construire la version autonome sans UPX
        run: python -m PyInstaller --clean --noconfirm --workpath build/portable --distpath dist/portable-build All_Media_Download-Portable.spec

      - name: Preparer les logos et les six dossiers dans les deux distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $folderEdition = "dist/All_Media_Download"
          $portableEdition = "dist/All-Download-Portable"
          New-Item -ItemType Directory -Force -Path $portableEdition | Out-Null
          Copy-Item "dist/portable-build/All_Media_Download.exe" "$portableEdition/All_Media_Download.exe"
          foreach ($root in @($folderEdition, $portableEdition)) {
            Copy-Item "logo.ico" "$root/logo.ico"
            Copy-Item "logo.jpg" "$root/logo.jpg"
            foreach ($category in @("AUTRES", "VIDÉOS", "CHAÎNES", "AUDIOS", "PLAYLIST", "GIFS")) {
              $targetDir = Join-Path $root $category
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              Copy-Item "$category/.gitkeep" (Join-Path $targetDir ".gitkeep")
            }
          }

      - name: Verifier le contenu et les icones des distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($root in @("dist/All_Media_Download", "dist/All-Download-Portable")) {
            $items = @(
              "$root/All_Media_Download.exe",
              "$root/logo.ico",
              "$root/logo.jpg"
            )
            foreach ($category in @("AUTRES", "VIDÉOS", "CHAÎNES", "AUDIOS", "PLAYLIST", "GIFS")) {
              $items += "$root/$category/.gitkeep"
            }
            foreach ($item in $items) {
              if (-not (Test-Path -LiteralPath $item)) { throw "Distribution incomplete : $item" }
            }
            Write-Output "Distribution verifiee : $root"
          }
          if (-not (Test-Path "dist/All_Media_Download/_internal")) {
            throw "Dossier _internal manquant dans l'edition en dossier"
          }
          if (Test-Path "dist/All-Download-Portable/_internal") {
            throw "L'edition portable ne doit pas dependre de _internal"
          }

      - name: Verifier le vrai demarrage des deux EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binFolder = Join-Path $env:LOCALAPPDATA "AllMediaDownload/bin"
          New-Item -ItemType Directory -Force -Path $binFolder | Out-Null
          # Ces fichiers factices evitent les telechargements reseau en test CI uniquement.
          New-Item -ItemType File -Force -Path (Join-Path $binFolder "yt-dlp.exe") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $binFolder "ffmpeg.exe") | Out-Null

          foreach ($root in @("dist/All_Media_Download", "dist/All-Download-Portable")) {
            $folder = (Resolve-Path $root).Path
            $exe = Join-Path $folder "All_Media_Download.exe"
            # Plusieurs redemarrages verifies : edition portable 8x,
            # edition en dossier 4x. Sans modifier les fonctions de l'app.
            $maxAttempts = if ($root -like "*Portable*") { 8 } else { 4 }
            foreach ($attempt in 1..$maxAttempts) {
              Write-Output "Test ouverture $attempt : $exe"
              $proc = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
              $visible = $false
              try {
                for ($i = 0; $i -lt 45; $i++) {
                  Start-Sleep -Seconds 1
                  $proc.Refresh()
                  if ($proc.HasExited) {
                    throw "Programme ferme au lancement (code $($proc.ExitCode))"
                  }
                  # En mode --onefile, le bootloader PyInstaller lance un
                  # processus enfant qui porte la fenetre. Le parent reste
                  # volontairement sans MainWindowTitle.
                  $copies = @(Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue)
                  if (@($copies | Where-Object { $_.MainWindowTitle -like "*erreur de démarrage*" }).Count -gt 0) {
                    throw "Une fenetre d'erreur est apparue"
                  }
                  if (@($copies | Where-Object { $_.MainWindowTitle -eq "All Media Download" }).Count -gt 0) {
                    $visible = $true
                    break
                  }
                }
                if (-not $visible) {
                  Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
                    Select-Object Id, ProcessName, MainWindowTitle, WorkingSet64 | Format-Table | Out-String | Write-Output
                  $crashLog = Join-Path $env:LOCALAPPDATA "AllMediaDownload/crash_log.txt"
                  if (Test-Path $crashLog) { Get-Content $crashLog -Tail 50 }
                  throw "La vraie fenetre All Media Download n'est pas apparue"
                }
                Start-Sleep -Seconds 2
                $proc.Refresh()
                if ($proc.HasExited) { throw "Fermeture inattendue apres affichage" }
                Write-Output "Demarrage reel reussi : All Media Download"
              } finally {
                # Arreter aussi l'enfant de l'edition monofichier.
                Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
                  Stop-Process -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Fabriquer et verifier les deux ZIP complets avec les sources GitHub
        run: python scripts/build_release_archives.py --output release-archives

      - name: Publier la Release Windows et les liens permanents du README
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          $portable = "release-archives/All-Download-Portable-Windows.zip"
          $classic = "release-archives/All-Download-Classique-Windows.zip"
          $notes = @"
          All-Download pour Windows.
          - Portable recommande : un seul EXE, sans dossier _internal.
          - Classique : EXE avec _internal (peut rencontrer un blocage Python.Runtime.dll sur certains PC).
          - Les deux ZIP contiennent les logos, les six dossiers multimédias et l'ensemble des fichiers GitHub suivis dans Code-source/.
          - Publication uniquement apres tests de demarrage Windows et tests Python.
          - Executables non signes : SmartScreen peut afficher un avertissement de reputation.
          "@
          gh release create $tag $portable $classic --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "All-Download Windows - Build $env:GITHUB_RUN_NUMBER" --notes "$notes" --latest
          if ($LASTEXITCODE -ne 0) { throw "Publication de la Release impossible" }
          Write-Output "ZIP Portable permanent : https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/All-Download-Portable-Windows.zip"
          Write-Output "ZIP Classique permanent : https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/All-Download-Classique-Windows.zip"

      - name: Conserver la distribution Portable comme artefact Actions
        uses: actions/upload-artifact@v7
        with:
          name: All-Download-Portable-Windows
          path: dist/All-Download-Portable/
          include-hidden-files: true
          if-no-files-found: error

      - name: Conserver la distribution Classique comme artefact Actions
        uses: actions/upload-artifact@v7
        with:
          name: All-Download-Dossier-Windows
          path: dist/All_Media_Download/
          include-hidden-files: true
          if-no-files-found: error

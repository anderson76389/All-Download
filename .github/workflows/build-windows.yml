name: Build All-Download (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule publication a la fois : les boutons pointent toujours
# vers la derniere Release ayant passe TOUS les tests.
concurrency:
  group: all-download-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Tester et compiler All-Download sous Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pythonnet==3.2.1 pyinstaller==6.22.3

      - name: Confirmer Python 64 bits (Windows x64)
        run: python -c "import struct; assert struct.calcsize('P') == 8, 'Python x64 requis pour les deux éditions'; print('Python x64 confirmé')"

      - name: Verifier la syntaxe
        run: python -m py_compile yt_app.py

      - name: Tester le routage et la preservation des medias
        run: python -m unittest discover -s tests -v

      - name: Tester les boutons de l'interface (DOM JavaScript)
        shell: pwsh
        run: |
          node --version
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0) { throw "Impossible d'installer l'environnement de test UI" }
          python -c 'import yt_app; from pathlib import Path; Path("tests/ui-test.html").write_text(yt_app.HTML_PAGE, encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { throw "Impossible d'extraire l'interface pour les tests" }
          node tests/test_ui_buttons.cjs
          if ($LASTEXITCODE -ne 0) { throw "Un bouton ou un workflow de l'interface a echoue" }
          node tests/test_ui_responsive.cjs
          if ($LASTEXITCODE -ne 0) { throw "L'interface ne s'adapte pas au plein écran dans Edge" }

      - name: Compiler le moteur autonome commun aux deux versions
        run: python -m PyInstaller --clean --noconfirm --workpath build/portable --distpath dist/portable-build All_Media_Download-Portable.spec

      - name: Verifier que l'EXE produit est bien x64
        run: |
          python -c "import struct, pathlib; p=pathlib.Path('dist/portable-build/All_Media_Download.exe'); b=p.read_bytes(); offset=struct.unpack_from('<I',b,0x3c)[0]; machine=struct.unpack_from('<H',b,offset+4)[0]; print('Architecture PE:',hex(machine)); assert machine==0x8664, 'EXE non x64'"

      - name: Preparer la version Portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/All-Download-Portable"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist/portable-build/All_Media_Download.exe" "$root/All_Media_Download.exe"
          Copy-Item "logo.ico" "$root/logo.ico"
          Copy-Item "logo.jpg" "$root/logo.jpg"
          foreach ($dir in @("AUDIOS", "AUTRES", "CHAÎNES", "GIFS", "PLAYLIST", "VIDÉOS")) {
            New-Item -ItemType Directory -Force -Path "$root/$dir" | Out-Null
            # Le dossier vide est créé directement, sans .gitkeep.
          }
          if (Test-Path "$root/_internal") { throw "L'EXE Portable ne doit pas avoir _internal" }

      - name: Installer Inno Setup pour l'edition Windows classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Installation Inno Setup impossible" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe absent" }

      - name: Construire le programme d'installation Windows classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          & $iscc "/DMyAppVersion=1.0.$env:GITHUB_RUN_NUMBER" "installer/All-Download.iss"
          if ($LASTEXITCODE -ne 0) { throw "Compilation de l'installateur en echec" }
          if (-not (Test-Path "dist/All-Download-Installer/All-Download-Setup.exe")) {
            throw "Installateur All-Download-Setup.exe absent"
          }

      - name: Verifier le paquet Portable et l'installateur Classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/All-Download-Portable"
          foreach ($f in @("$root/All_Media_Download.exe", "$root/logo.ico", "$root/logo.jpg")) {
            if (-not (Test-Path $f)) { throw "Portable incomplet : $f" }
          }
          foreach ($d in @("AUDIOS", "AUTRES", "CHAÎNES", "GIFS", "PLAYLIST", "VIDÉOS")) {
            if (-not (Test-Path "$root/$d" -PathType Container)) { throw "Dossier $d absent" }
            if (Test-Path "$root/$d/.gitkeep") { throw "Marqueur .gitkeep interdit dans $d" }
          }
          if (-not (Test-Path "dist/All-Download-Installer/All-Download-Setup.exe")) {
            throw "Installateur Classique absent"
          }

      - name: Installer la version classique sur Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "dist/All-Download-Installer/All-Download-Setup.exe").Path
          $installed = Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test"
          $process = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installateur non fonctionnel : $($process.ExitCode)" }
          if (-not (Test-Path "$installed/All_Media_Download.exe")) {
            throw "EXE manquant apres installation"
          }
          if (-not (Test-Path "$installed/.all-download-installed")) {
            throw "Marqueur installation manquant"
          }
          if (-not (Test-Path "$installed/unins000.exe")) {
            throw "Desinstalleur Windows manquant"
          }
          if (Test-Path "$installed/_internal") {
            throw "Version classique incompatible : _internal encore present"
          }
          foreach ($d in @("AUDIOS", "AUTRES", "CHAÎNES", "GIFS", "PLAYLIST", "VIDÉOS")) {
            if (-not (Test-Path "$installed/$d" -PathType Container)) {
              throw "Dossier installe absent : $d"
            }
          }
          Write-Output "Installation classique effectuee avec succes"

      - name: Tester 8 demarrages Portable et 4 demarrages Classique installee
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:LOCALAPPDATA "AllMediaDownload/bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          # Outils factices seulement dans le runner pour ne pas telecharger les outils dans la CI.
          New-Item -ItemType File -Force -Path (Join-Path $bin "yt-dlp.exe") | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $bin "ffmpeg.exe") | Out-Null
          $scenarios = @(
            @{ Name="Portable"; Exe=(Resolve-Path "dist/All-Download-Portable/All_Media_Download.exe").Path; Times=8 },
            @{ Name="Classique"; Exe=(Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test/All_Media_Download.exe"); Times=4 }
          )
          foreach ($scenario in $scenarios) {
            foreach ($attempt in 1..$scenario.Times) {
              Write-Output "$($scenario.Name) demarrage $attempt/$($scenario.Times)"
              $exe = $scenario.Exe
              $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
              $visible = $false
              try {
                for ($i=0; $i -lt 45; $i++) {
                  Start-Sleep -Seconds 1
                  $proc.Refresh()
                  if ($proc.HasExited) { throw "Fermeture inattendue $($proc.ExitCode)" }
                  $others = @(Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue)
                  if (@($others | Where-Object { $_.MainWindowTitle -like "*erreur de démarrage*" }).Count -gt 0) {
                    throw "Fenetre d'erreur de demarrage detectee"
                  }
                  if (@($others | Where-Object { $_.MainWindowTitle -eq "All Media Download" }).Count -gt 0) {
                    $visible = $true
                    break
                  }
                }
                if (-not $visible) {
                  $log = Join-Path $env:LOCALAPPDATA "AllMediaDownload/crash_log.txt"
                  if (Test-Path $log) { Get-Content $log -Tail 60 }
                  throw "La vraie fenetre du logiciel n'est pas apparue"
                }
                Start-Sleep -Seconds 2
                $proc.Refresh()
                if ($proc.HasExited) { throw "Application fermee juste apres ouverture" }
                Write-Output "Demarrage reussi : $($scenario.Name)"
              } finally {
                Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
                  Stop-Process -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Verifier la desinstallation de Windows Classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Desinstalleur non trouve" }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Desinstallation en echec : $($proc.ExitCode)" }
          if (Test-Path "$installDir/All_Media_Download.exe") {
            throw "L'EXE reste apres desinstallation"
          }

      - name: Fabriquer et verifier les deux ZIP complets avec les sources GitHub
        run: python scripts/build_release_archives.py --output release-archives

      - name: Publier la Release Windows et les liens permanents du README
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          $portable = "release-archives/All-Download-Portable-Windows.zip"
          $classic = "release-archives/All-Download-Classique-Windows.zip"
          $notes = @"
          All-Download Windows
          - Portable : executable autonome sans installation.
          - Classique : All-Download-Setup.exe, raccourcis Windows et desinstallation.
          - Les deux utilisent le moteur autonome compatible (aucun dossier _internal a distribuer).
          - Le ZIP contient les logos, les six dossiers et la copie des sources dans Code-source/.
          - La version installee conserve les medias hors du dossier de l'application.
          - Application non signee : avertissement SmartScreen possible.
          "@
          gh release create $tag $portable $classic --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "All-Download Windows - Build $env:GITHUB_RUN_NUMBER" --notes "$notes" --latest
          if ($LASTEXITCODE -ne 0) { throw "Publication de la Release impossible" }
          Write-Output "ZIP Portable permanent : https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/All-Download-Portable-Windows.zip"
          Write-Output "ZIP Classique permanent : https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/All-Download-Classique-Windows.zip"

      - name: Conserver la distribution Portable comme artefact Actions
        uses: actions/upload-artifact@v7
        with:
          name: All-Download-Portable-Windows
          path: release-archives/All-Download-Portable-Windows.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Conserver le ZIP d'installation Classique comme artefact Actions
        uses: actions/upload-artifact@v7
        with:
          name: All-Download-Classique-Windows
          path: release-archives/All-Download-Classique-Windows.zip
          include-hidden-files: true
          if-no-files-found: error

name: Build All-Download (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule publication a la fois : les boutons pointent toujours
# vers la derniere Release ayant passe TOUS les tests.
concurrency:
  group: all-download-windows-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Tester et compiler All-Download sous Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pythonnet==3.2.1 pyinstaller==6.22.3 "psutil>=6.1,<8"

      - name: Confirmer Python 64 bits (Windows x64)
        run: python -c "import struct; assert struct.calcsize('P') == 8, 'Python x64 requis pour les deux éditions'; print('Python x64 confirmé')"

      - name: Verifier la syntaxe
        run: python -m py_compile yt_app.py

      - name: Tester le routage et la preservation des medias
        run: python -m unittest discover -s tests -v

      - name: Executer un vrai yt-dlp Windows x64 et confirmer sa version
        shell: pwsh
        run: |
          python -m scripts.verify_ytdlp_runtime
          if ($LASTEXITCODE -ne 0) {
            throw "Un vrai yt-dlp.exe valide ne peut pas s'executer sur Windows : aucune Release autorisee"
          }

      - name: Tester les boutons de l'interface (DOM JavaScript)
        shell: pwsh
        run: |
          node --version
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0) { throw "Impossible d'installer l'environnement de test UI" }
          python -c 'import yt_app; from pathlib import Path; Path("tests/ui-test.html").write_text(yt_app.HTML_PAGE, encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { throw "Impossible d'extraire l'interface pour les tests" }
          node tests/test_ui_buttons.cjs
          if ($LASTEXITCODE -ne 0) { throw "Un bouton ou un workflow de l'interface a echoue" }
          node tests/test_ui_responsive.cjs
          if ($LASTEXITCODE -ne 0) { throw "L'interface ne s'adapte pas au plein écran dans Edge" }

      - name: Corriger l'initialisation WebView2 du premier lancement Windows
        shell: pwsh
        run: |
          python scripts/patch_webview_startup.py
          if ($LASTEXITCODE -ne 0) { throw "Patch pywebview/WinForms incompatible : compilation interdite" }
          python scripts/patch_webview_startup.py --check-only
          if ($LASTEXITCODE -ne 0) { throw "Patch WebView2 non verifie" }

      - name: Compiler le moteur autonome commun aux deux versions
        run: python -m PyInstaller --clean --noconfirm --workpath build/portable --distpath dist/portable-build All_Media_Download-Portable.spec

      - name: Verifier que l'EXE produit est bien x64
        run: |
          python -c "import struct, pathlib; p=pathlib.Path('dist/portable-build/All_Media_Download.exe'); b=p.read_bytes(); offset=struct.unpack_from('<I',b,0x3c)[0]; machine=struct.unpack_from('<H',b,offset+4)[0]; print('Architecture PE:',hex(machine)); assert machine==0x8664, 'EXE non x64'"

      - name: Preparer la version Portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/All-Download-Portable"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "dist/portable-build/All_Media_Download.exe" "$root/All_Media_Download.exe"
          Copy-Item "logo.ico" "$root/logo.ico"
          Copy-Item "logo.jpg" "$root/logo.jpg"
          foreach ($dir in @("AUDIOS", "AUTRES", "CHAÎNES", "GIFS", "PLAYLIST", "VIDÉOS")) {
            New-Item -ItemType Directory -Force -Path "$root/$dir" | Out-Null
            # Le dossier vide est créé directement, sans .gitkeep.
          }
          if (Test-Path "$root/_internal") { throw "L'EXE Portable ne doit pas avoir _internal" }
          if (Get-ChildItem $root -File -Recurse -Filter ".gitkeep" -ErrorAction SilentlyContinue) {
            throw "Les nouvelles distributions ne doivent contenir aucun .gitkeep"
          }

      - name: Installer Inno Setup pour l'edition Windows classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Installation Inno Setup impossible" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe absent" }

      - name: Construire le programme d'installation Windows classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Inno Setup 6/ISCC.exe"
          & $iscc "/DMyAppVersion=1.0.$env:GITHUB_RUN_NUMBER" "installer/All-Download.iss"
          if ($LASTEXITCODE -ne 0) { throw "Compilation de l'installateur en echec" }
          if (-not (Test-Path "dist/All-Download-Installer/All-Download-Setup.exe")) {
            throw "Installateur All-Download-Setup.exe absent"
          }

      - name: Verifier le paquet Portable et l'installateur Classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "dist/All-Download-Portable"
          foreach ($f in @("$root/All_Media_Download.exe", "$root/logo.ico", "$root/logo.jpg")) {
            if (-not (Test-Path $f)) { throw "Portable incomplet : $f" }
          }
          foreach ($d in @("AUDIOS", "AUTRES", "CHAÎNES", "GIFS", "PLAYLIST", "VIDÉOS")) {
            if (-not (Test-Path "$root/$d" -PathType Container)) { throw "Dossier $d absent" }
            if (Test-Path "$root/$d/.gitkeep") { throw "Marqueur .gitkeep interdit dans $d" }
          }
          if (-not (Test-Path "dist/All-Download-Installer/All-Download-Setup.exe")) {
            throw "Installateur Classique absent"
          }

      - name: Installer la version classique sur Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "dist/All-Download-Installer/All-Download-Setup.exe").Path
          $installed = Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test"
          $process = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installateur non fonctionnel : $($process.ExitCode)" }
          if (-not (Test-Path "$installed/All_Media_Download.exe")) {
            throw "EXE manquant apres installation"
          }
          if (-not (Test-Path "$installed/.all-download-installed")) {
            throw "Marqueur installation manquant"
          }
          if (-not (Test-Path "$installed/unins000.exe")) {
            throw "Desinstalleur Windows manquant"
          }
          if (Test-Path "$installed/_internal") {
            throw "Version classique incompatible : _internal encore present"
          }
          foreach ($d in @("AUDIOS", "AUTRES", "CHAÎNES", "GIFS", "PLAYLIST", "VIDÉOS")) {
            if (-not (Test-Path "$installed/$d" -PathType Container)) {
              throw "Dossier installe absent : $d"
            }
          }
          if (-not (Test-Path "$installed/Donnees" -PathType Container)) {
            throw "Dossier Donnees absent dans la version Classique"
          }
          Write-Output "Installation classique effectuee avec succes"

      - name: Verifier un premier lancement froid sans relance pour chaque edition
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class WebViewColdProbe {
              [DllImport("user32.dll", SetLastError=true)]
              public static extern IntPtr SendMessageTimeout(IntPtr hwnd, uint msg, IntPtr w, IntPtr l,
                  uint flags, uint timeout, out IntPtr result);
          }
          "@
          $originalLocal = $env:LOCALAPPDATA
          $scenarios = @(
            @{ Name="Portable"; Exe=(Resolve-Path "dist/All-Download-Portable/All_Media_Download.exe").Path },
            @{ Name="Classique"; Exe=(Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test/All_Media_Download.exe") }
          )
          foreach ($scenario in $scenarios) {
            $exe = $scenario.Exe
            $label = $scenario.Name
            $data = Join-Path (Split-Path $exe -Parent) "Donnees"
            $bin = Join-Path $data "bin"
            New-Item -ItemType Directory -Force -Path $bin | Out-Null
            foreach ($tool in @("yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe")) {
              [IO.File]::WriteAllBytes((Join-Path $bin $tool), [byte[]]@(77,90))
            }
            $log = Join-Path $data "startup_log.txt"
            if (Test-Path $log) { Remove-Item $log -Force }
            $coldRoot = Join-Path $env:RUNNER_TEMP ("AllDownloadWebViewCold-" + $label)
            if (Test-Path $coldRoot) { Remove-Item $coldRoot -Force -Recurse }
            New-Item -ItemType Directory -Force -Path $coldRoot | Out-Null
            $env:LOCALAPPDATA = $coldRoot
            $started = [System.Diagnostics.Stopwatch]::StartNew()
            try {
              $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
            } finally {
              $env:LOCALAPPDATA = $originalLocal
            }
            $good = $false
            $recovered = $false
            $guiPID = $null
            try {
              for ($i=0; $i -lt 110; $i++) {
                Start-Sleep -Milliseconds 500
                if (-not (Test-Path $log)) { continue }
                $entries = @(Get-Content $log -Tail 70)
                $recovered = @($entries | Where-Object { $_.Contains("nouvelle tentative automatique unique") }).Count -gt 0
                if ($recovered) { break }
                $loadedEntries = @($entries | Where-Object { $_ -match 'PID=([0-9]+) Interface HTML chargee' })
                if ($loadedEntries.Count -gt 0) {
                  $parsed = [regex]::Match($loadedEntries[-1], 'PID=([0-9]+) Interface HTML chargee')
                  $guiPID = [int]$parsed.Groups[1].Value
                  $gui = Get-Process -Id $guiPID -ErrorAction SilentlyContinue
                  if ($gui -and $gui.MainWindowHandle -ne [IntPtr]::Zero) {
                    $probeResult = [IntPtr]::Zero
                    $responsive = [WebViewColdProbe]::SendMessageTimeout($gui.MainWindowHandle,0,[IntPtr]::Zero,[IntPtr]::Zero,2,3000,[ref]$probeResult)
                    if ($responsive -ne [IntPtr]::Zero) { $good = $true; break }
                  }
                }
              }
              $started.Stop()
              if (-not $good -or $recovered) {
                if (Test-Path $log) { Get-Content $log -Tail 50 }
                throw "Premier lancement froid $label non reactif ou ayant necessite une relance (duree $([math]::Round($started.Elapsed.TotalSeconds,1))s)"
              }
              Write-Output "OK : premier lancement froid $label reactif, sans relance, en $([math]::Round($started.Elapsed.TotalSeconds,1))s"
            } finally {
              $active = @(Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue)
              foreach ($p in $active) {
                try { [void]$p.CloseMainWindow() } catch {}
              }
              Start-Sleep -Seconds 2
              Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
            }
          }

      - name: Verifier obligatoirement 12 demarrages Windows reactifs (6+6)
        id: webview_startup_diagnostic
        # Le gel au premier lancement doit bloquer toute nouvelle Release.
        # Refuser la publication si une seule ouverture reste figee.
        continue-on-error: false
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portableRoot = (Resolve-Path "dist/All-Download-Portable").Path
          $classicData = Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test/Donnees"
          $portableData = Join-Path $portableRoot "Donnees"
          # Outils factices NON VIDES uniquement sur le runner :
          # aucun gros telechargement FFmpeg pendant la mesure des demarrages.
          foreach ($dataDir in @($portableData, $classicData)) {
            $bin = Join-Path $dataDir "bin"
            New-Item -ItemType Directory -Force -Path $bin | Out-Null
            foreach ($tool in @("yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe")) {
              [IO.File]::WriteAllBytes((Join-Path $bin $tool), [byte[]]@(77,90))
            }
          }
          # Le titre seul n'est pas une preuve : Windows peut afficher une
          # fenetre qui reste figee sur son thread UI.
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class AllDownloadWindowProbe {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr SendMessageTimeout(
                  IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam,
                  uint flags, uint timeout, out IntPtr result);
          }
          "@
          $config = Join-Path $classicData "config.json"
          if (Test-Path $config) {
            Write-Output "Suppression de la configuration CI (runner jetable), pour tester un premier lancement neuf"
            Remove-Item $config -Force
          }
          # La CI normale couvre le premier demarrage et des relances reelles.
          # La commande manuelle Actions conserve le stress 8+4 complet,
          # qui peut encore reveler une latence WebView2 intermittente.
          $stress = ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch")
          $portableTimes = if ($stress) { 8 } else { 6 }
          $classicTimes = if ($stress) { 8 } else { 6 }
          $scenarios = @(
            @{ Name="Portable"; Exe=(Resolve-Path "dist/All-Download-Portable/All_Media_Download.exe").Path; Times=$portableTimes },
            @{ Name="Classique"; Exe=(Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test/All_Media_Download.exe"); Times=$classicTimes }
          )
          foreach ($scenario in $scenarios) {
            foreach ($attempt in 1..$scenario.Times) {
              Write-Output "$($scenario.Name) demarrage $attempt/$($scenario.Times)"
              $exe = $scenario.Exe
              $dataDir = if ($scenario.Name -eq "Portable") { $portableData } else { $classicData }
              $startupTimer = [System.Diagnostics.Stopwatch]::StartNew()
              $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
              $visible = $false
              try {
                for ($i=0; $i -lt 45; $i++) {
                  Start-Sleep -Seconds 1
                  $proc.Refresh()
                  if ($proc.HasExited) { throw "Fermeture inattendue $($proc.ExitCode)" }
                  $others = @(Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue)
                  if (@($others | Where-Object { $_.MainWindowTitle -like "*erreur de démarrage*" }).Count -gt 0) {
                    throw "Fenetre d'erreur de demarrage detectee"
                  }
                  $gui = @($others | Where-Object {
                    $_.MainWindowTitle -eq "All Media Download" -and $_.MainWindowHandle -ne [IntPtr]::Zero
                  } | Select-Object -First 1)
                  if ($gui.Count -gt 0) {
                    $visible = $true
                    break
                  }
                }
                if (-not $visible) {
                  $log = Join-Path $dataDir "crash_log.txt"
                  if (Test-Path $log) { Get-Content $log -Tail 60 }
                  throw "La vraie fenetre du logiciel n'est pas apparue"
                }
                Start-Sleep -Seconds 2
                $proc.Refresh()
                if ($proc.HasExited) { throw "Application fermee juste apres ouverture" }
                $guiProcess = Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
                  Where-Object { $_.MainWindowTitle -eq "All Media Download" -and $_.MainWindowHandle -ne [IntPtr]::Zero } |
                  Select-Object -First 1
                if (-not $guiProcess) { throw "Fenetre disparue pendant la verification" }
                # pywebview cree la fenetre native AVANT de terminer WebView2.
                # Le thread WinForms peut etre occupe pendant cette phase : ne
                # verifier WM_NULL qu'apres l'evenement HTML de ce processus.
                $trace = Join-Path $dataDir "startup_log.txt"
                $htmlReady = $false
                for ($readyAttempt=0; $readyAttempt -lt 100; $readyAttempt++) {
                  $proc.Refresh()
                  if ($proc.HasExited) { throw "Application fermee avant chargement HTML" }
                  if (Test-Path $trace) {
                    $lines = @(Get-Content $trace -Tail 45)
                    if (@($lines | Where-Object { $_.Contains("PID=$($guiProcess.Id) Interface HTML chargee") }).Count -gt 0) {
                      $htmlReady = $true
                      break
                    }
                  }
                  Start-Sleep -Milliseconds 500
                }
                if (-not $htmlReady) {
                  if (Test-Path $trace) { Get-Content $trace -Tail 35 }
                  $crashLog = Join-Path $dataDir "crash_log.txt"
                  if (Test-Path $crashLog) {
                    Write-Output "Diagnostic Python/CLR :"
                    Get-Content $crashLog -Tail 100
                  }
                  Write-Output "Processus WebView2 visibles :"
                  Get-Process -Name "msedgewebview2" -ErrorAction SilentlyContinue |
                    Select-Object -First 10 Id, CPU, Responding, StartTime |
                    Format-Table -AutoSize | Out-String | Write-Output
                  throw "Le contenu HTML n'a jamais fini de charger (50 s) : $($scenario.Name)"
                }
                # Une fois l'interface chargee, une fenetre qui ne repond pas
                # a WM_NULL pendant 3 s est vraiment bloquee.
                $probeResult = [IntPtr]::Zero
                $probe = [AllDownloadWindowProbe]::SendMessageTimeout(
                  $guiProcess.MainWindowHandle, 0, [IntPtr]::Zero, [IntPtr]::Zero,
                  2, 3000, [ref]$probeResult)
                if ($probe -eq [IntPtr]::Zero) {
                  if (Test-Path $trace) { Get-Content $trace -Tail 25 }
                  throw "Fenetre Windows figee apres chargement HTML : $($scenario.Name)"
                }
                $startupTimer.Stop()
                Write-Output "Demarrage reussi, HTML charge et interface reactive : $($scenario.Name) en $([math]::Round($startupTimer.Elapsed.TotalSeconds,1)) secondes"
              } finally {
                # Tester une fermeture NORMALE pour liberer WebView2 et son
                # profil. Stop-Process -Force laissait potentiellement des
                # enfants WebView2 et ralentissait les lancements suivants.
                $guiToClose = Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
                  Where-Object { $_.MainWindowTitle -eq "All Media Download" } |
                  Select-Object -First 1
                if ($guiToClose) {
                  try { [void]$guiToClose.CloseMainWindow() } catch {}
                }
                try { Wait-Process -Id $proc.Id -Timeout 10 -ErrorAction SilentlyContinue } catch {}
                $proc.Refresh()
                if (-not $proc.HasExited) {
                  & taskkill.exe /T /F /PID $proc.Id 2>$null | Out-Null
                }
                # Laisser le temps aux sous-processus Edge/WebView2 de
                # liberer leurs ressources avant de relancer le meme EXE.
                # Une nouvelle ouverture instantanee n'est pas representative
                # d'un utilisateur et accentue les courses d'initialisation.
                Start-Sleep -Seconds 6
              }
            }
          }

      - name: Signaler les blocages WebView2 observes en CI
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.webview_startup_diagnostic.outcome }}" -eq "failure") {
            Write-Output "::warning title=WebView2 instable::Le test de lancement Windows a echoue ; le blocage intermittent reste connu et non resolu."
            "### Diagnostic WebView2 : ECHEC observe (probleme intermittent non resolu)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "### Diagnostic WebView2 : essais repetitifs passes sur ce runner" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Simuler le crash CLR et verifier la relance automatique sans popup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "dist/All-Download-Portable/All_Media_Download.exe").Path
          $env:ALL_DOWNLOAD_TEST_CLR_FAILURE_ONCE = "1"
          try {
            $initial = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          } finally {
            Remove-Item Env:ALL_DOWNLOAD_TEST_CLR_FAILURE_ONCE -ErrorAction SilentlyContinue
          }
          $started = $false
          try {
            for ($i=0; $i -lt 65; $i++) {
              Start-Sleep -Seconds 1
              $apps = @(Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue)
              if (@($apps | Where-Object { $_.MainWindowTitle -like "*erreur de démarrage*" }).Count -gt 0) {
                throw "Fenetre de crash Windows visible : la relance ne fonctionne pas"
              }
              if (@($apps | Where-Object { $_.MainWindowTitle -eq "All Media Download" }).Count -gt 0) {
                $started = $true
                break
              }
            }
            if (-not $started) { throw "Le processus relance ne presente pas son interface" }
            $logFile = Join-Path $env:GITHUB_WORKSPACE "dist/All-Download-Portable/Donnees/crash_log.txt"
            if (-not (Test-Path $logFile)) { throw "Journal de relance CLR absent" }
            $contents = Get-Content -Raw -Encoding UTF8 $logFile
            if (-not $contents.Contains("Erreur CLR transitoire")) {
              throw "Aucune trace de relance CLR : le test injecte ne s'est pas execute"
            }
            Write-Output "OK : echec CLR simule, relance PyInstaller autonome et GUI fonctionnelle"
          } finally {
            Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Simuler un WebView2 bloque et verifier sa relance automatique unique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "dist/All-Download-Portable/All_Media_Download.exe").Path
          $startupLog = (Join-Path (Split-Path $exe -Parent) "Donnees/startup_log.txt")
          $env:ALL_DOWNLOAD_TEST_WEBVIEW_HANG_ONCE = "1"
          try {
            $initial = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          } finally {
            Remove-Item Env:ALL_DOWNLOAD_TEST_WEBVIEW_HANG_ONCE -ErrorAction SilentlyContinue
          }
          $restarted = $false
          try {
            for ($i=0; $i -lt 95; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $startupLog) {
                $entries = @(Get-Content $startupLog -Tail 120)
                $newProcess = @(Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
                    Where-Object { $_.Id -ne $initial.Id } | Select-Object -First 1)
                if ($newProcess.Count -gt 0 -and
                    @($entries | Where-Object { $_.Contains("WebView2 bloque: nouvelle tentative automatique unique") }).Count -gt 0) {
                  $restarted = $true
                  break
                }
              }
            }
            if (-not $restarted) {
              if (Test-Path $startupLog) { Get-Content $startupLog -Tail 70 }
              throw "Watchdog WebView2 : relance automatique non detectee"
            }
            Write-Output "OK : le blocage simule a declenche une vraie relance EXE, unique et sans fenetre d'erreur"
          } finally {
            Get-Process -Name "All_Media_Download" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Verifier la desinstallation de Windows Classique
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "All-Download-Installed-Test"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Desinstalleur non trouve" }
          # Des medias et reglages fictifs mais REELS sont places dans le
          # repertoire d'installation pour verifier qu'une desinstallation
          # n'efface aucun fichier personnel.
          $mediaToKeep = Join-Path $installDir "VIDÉOS/preserve-me.mp4"
          $prefsToKeep = Join-Path $installDir "Donnees/config.json"
          [IO.File]::WriteAllText($mediaToKeep, "MEDIA-PERSONNEL-NE-PAS-EFFACER")
          [IO.File]::WriteAllText($prefsToKeep, '{"settings":{"theme":"dark_pure"}}')
          # Une mise a jour dans le meme dossier ne doit ni supprimer ni
          # reinitialiser les preferences ou les medias precedents.
          $setup = (Resolve-Path "dist/All-Download-Installer/All-Download-Setup.exe").Path
          $update = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir") -Wait -PassThru
          if ($update.ExitCode -ne 0) { throw "Mise a jour Classique en echec" }
          if ((Get-Content -Raw -Encoding UTF8 $mediaToKeep) -ne "MEDIA-PERSONNEL-NE-PAS-EFFACER") {
            throw "La mise a jour Classique a efface ou modifie un media"
          }
          if (-not ((Get-Content -Raw -Encoding UTF8 $prefsToKeep).Contains("dark_pure"))) {
            throw "La mise a jour Classique a efface les preferences"
          }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Desinstallation en echec : $($proc.ExitCode)" }
          if (Test-Path "$installDir/All_Media_Download.exe") {
            throw "L'EXE reste apres desinstallation"
          }
          if ((Get-Content -Raw -Encoding UTF8 $mediaToKeep) -ne "MEDIA-PERSONNEL-NE-PAS-EFFACER") {
            throw "Le desinstalleur a efface ou modifie les medias personnels"
          }
          if (-not ((Get-Content -Raw -Encoding UTF8 $prefsToKeep).Contains("dark_pure"))) {
            throw "Le desinstalleur a efface les preferences"
          }
          Write-Output "OK : mise a jour et desinstallation conservent medias et preferences"

      - name: Fabriquer et verifier les deux ZIP complets avec les sources GitHub
        run: python scripts/build_release_archives.py --output release-archives

      - name: Publier la Release Windows et les liens permanents du README
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          $portable = "release-archives/All-Download-Portable-Windows.zip"
          $classic = "release-archives/All-Download-Classique-Windows.zip"
          $notes = @"
          All-Download Windows
          - Portable : executable autonome sans installation.
          - Classique : All-Download-Setup.exe, raccourcis Windows et desinstallation.
          - Les deux utilisent le moteur autonome compatible (aucun dossier _internal a distribuer).
          - Les deux editions utilisent les six categories et Donnees/ a cote de leur EXE.
          - Le ZIP Portable contient les six dossiers, aucun faux yt-dlp.exe, ffmpeg.exe, ffprobe.exe, ni Donnees/ du runner. Les vrais outils sont telecharges et verifies en PE x64 au premier lancement, avec remplacement des invalides.
          - Le ZIP Classique contient uniquement l'installateur et les sources, sans dossiers medias parasites.
          - Test CI obligatoire : executable yt-dlp officiel telecharge et lance avec --version sur Windows x64.
          - La mise a jour et la desinstallation Classique conservent medias et reglages personnels.
          - WebView2 : correction du pont JavaScript (aucune reference WinForms publique), testee sur 32 premiers lancements experimentaux, puis 12 lancements Windows obligatoires en CI.
          - Sur le runner de comparaison : 2/5 de l'ancienne version et 8/9 de la version corrigee sans relance.
          - Une lenteur WebView2 reste possible : watchdog de recuperation unique et journaux presents.
          - Application non signee : avertissement SmartScreen possible.
          "@
          gh release create $tag $portable $classic --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "All-Download Windows - Build $env:GITHUB_RUN_NUMBER" --notes "$notes" --latest
          if ($LASTEXITCODE -ne 0) { throw "Publication de la Release impossible" }
          Write-Output "ZIP Portable permanent : https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/All-Download-Portable-Windows.zip"
          Write-Output "ZIP Classique permanent : https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/All-Download-Classique-Windows.zip"

      - name: Conserver la distribution Portable comme artefact Actions
        uses: actions/upload-artifact@v7
        with:
          name: All-Download-Portable-Windows
          path: release-archives/All-Download-Portable-Windows.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Conserver le ZIP d'installation Classique comme artefact Actions
        uses: actions/upload-artifact@v7
        with:
          name: All-Download-Classique-Windows
          path: release-archives/All-Download-Classique-Windows.zip
          include-hidden-files: true
          if-no-files-found: error

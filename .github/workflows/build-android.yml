name: Build and test Android (beta)
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Préparer le SDK Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Tests unitaires et compilation APK
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: All-Download-Android-beta
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Rapports tests JVM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  test-on-emulator:
    name: Android emulator API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Activer KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Installer l'APK et lancer les tests sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            gradle --no-daemon -p android :app:assembleDebug :app:assembleDebugAndroidTest
            if [ "${{ matrix.api }}" = "28" ]; then
              adb install -r android/app/build/outputs/apk/debug/app-debug.apk
              adb shell pm grant com.alldownload.android android.permission.WRITE_EXTERNAL_STORAGE
            fi
            gradle --no-daemon -p android :app:connectedDebugAndroidTest
      - name: Rapport tests émulateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-emulator-results-API-${{ matrix.api }}
          path: android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

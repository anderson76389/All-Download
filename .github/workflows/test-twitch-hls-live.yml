name: Validation réelle du secours HLS Twitch (temporaire)

on:
  pull_request:
    paths:
      - "scripts/test_twitch_hls_fallback_live.py"
      - ".github/workflows/test-twitch-hls-live.yml"

permissions:
  contents: read

jobs:
  true-vod:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Installer les dependances de test
        run: python -m pip install pywebview==6.2.1 pythonnet==3.2.1 "psutil>=6.1,<8"
      - name: Verifier la syntaxe
        run: python -m py_compile yt_app.py twitch_vod.py twitch_hls.py scripts/test_twitch_hls_fallback_live.py
      - name: Telecharger 6 secondes de la VOD abonne via la file All-Download
        timeout-minutes: 9
        run: python scripts/test_twitch_hls_fallback_live.py

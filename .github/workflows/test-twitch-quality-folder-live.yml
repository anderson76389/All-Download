name: Test reel qualite et dossier Twitch (temporaire)

on:
  pull_request:
    paths:
      - "scripts/test_twitch_quality_folder_live.py"
      - ".github/workflows/test-twitch-quality-folder-live.yml"

permissions:
  contents: read

jobs:
  twitch-real-720p:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Dependances de tests Windows
        run: python -m pip install pywebview==6.2.1 pythonnet==3.2.1 "psutil>=6.1,<8"
      - name: Syntaxe Twitch
        run: python -m py_compile yt_app.py twitch_hls.py twitch_vod.py scripts/test_twitch_quality_folder_live.py
      - name: Test reel VOD 720p avec enregistrement dans TWITCH
        timeout-minutes: 9
        run: python scripts/test_twitch_quality_folder_live.py

name: Diagnostic PyInstaller - Onefile vs Onedir

on:
  push:
    branches:
      - diagnostic/pyinstaller-onedir-vs-onefile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Comparer 16 premiers lancements Windows (sans Release)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Charger uniquement la branche de diagnostic
        uses: actions/checkout@v4

      - name: Installer Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Installer exactement les dependances de la Build publiee
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.2.1 pythonnet==3.2.1 pyinstaller==6.22.3 "psutil>=6.1,<8"
          if ($LASTEXITCODE -ne 0) { throw "Dependances introuvables" }

      - name: Tests source et compatibilite du correctif WebView2
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Tests Python invalides" }
          python scripts/patch_webview_startup.py
          if ($LASTEXITCODE -ne 0) { throw "Patch WebView2 impossible" }
          python scripts/patch_webview_startup.py --check-only
          if ($LASTEXITCODE -ne 0) { throw "Patch WebView2 non verifie" }

      - name: Construire EXE monofichier identique au mode actuel
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --workpath build/onefile --distpath dist/onefile All_Media_Download-Portable.spec
          if ($LASTEXITCODE -ne 0) { throw "Compilation onefile echouee" }
          if (-not (Test-Path "dist/onefile/All_Media_Download.exe")) { throw "EXE onefile absent" }

      - name: Construire EXE dossier avec dependances deja extraites
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --workpath build/onedir --distpath dist/onedir All_Media_Download.spec
          if ($LASTEXITCODE -ne 0) { throw "Compilation onedir echouee" }
          if (-not (Test-Path "dist/onedir/All_Media_Download/All_Media_Download.exe")) { throw "EXE onedir absent" }
          if (-not (Test-Path "dist/onedir/All_Media_Download/_internal")) { throw "Dependances onedir absentes" }

      - name: Comparer 8 premiers lancements froids par compilation
        shell: pwsh
        run: |
          ./scripts/compare_pyinstaller_startup.ps1

      - name: Conserver tous les resultats et journaux (meme en echec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-comparaison-pyinstaller-windows
          path: |
            startup-comparison/results.json
            startup-comparison/startup-*.txt
            startup-comparison/crash-*.txt
          if-no-files-found: warn
          retention-days: 30

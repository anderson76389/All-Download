name: Test reel Twitch NATIF 1080/720 sans reencodage (temporaire)

on:
  pull_request:
    paths:
      - "scripts/test_twitch_native_live_temp.py"
      - ".github/workflows/test-twitch-native-live-temp.yml"

permissions:
  contents: read

jobs:
  native-stream:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Installer les dependances de validation Windows
        run: python -m pip install pywebview==6.2.1 pythonnet==3.2.1 "psutil>=6.1,<8"
      - name: Verifier syntaxe des modules Twitch
        run: python -m py_compile yt_app.py twitch_hls.py twitch_vod.py scripts/test_twitch_native_live_temp.py
      - name: Telecharger deux vrais MP4 natifs 1080p 720p sans reencoder
        timeout-minutes: 11
        run: python scripts/test_twitch_native_live_temp.py

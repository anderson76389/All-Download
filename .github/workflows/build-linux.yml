name: Build and test Linux (beta)

on:
  push:
    branches: [main, feature/linux-app]
    paths:
      - "linux/**"
      - "yt_app.py"
      - ".github/workflows/build-linux.yml"
  pull_request:
    paths:
      - "linux/**"
      - "yt_app.py"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-download-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout All-Download
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native libraries for Qt WebEngine and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-image0 libxcb-util1 libxcb-render-util0 libxcb-xkb1 libxcb-randr0 libxcb-xfixes0 libxcb-glx0 libxcb-shm0 libxcb-xinput0 libegl1 libgl1 libdbus-1-3 libnss3 libasound2t64 libpulse0 libgtk-3-0
      - name: Install UI backend and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/requirements.txt
      - name: Compile sources and run offline tests
        run: |
          python -m compileall -q linux
          python linux/extract_ui.py --output linux/ui.html
          python -m unittest discover -s linux/tests -p 'test_*.py' -v
      - name: Bundle official Linux yt-dlp and FFmpeg executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/All-Download/Donnees/bin "$RUNNER_TEMP/ffmpeg"
          curl -fL --retry 3 --connect-timeout 20 -o stage/All-Download/Donnees/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          curl -fL --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg"
          FFMPEG="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg | head -n 1)"
          FFPROBE="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffprobe | head -n 1)"
          test -n "$FFMPEG" && test -n "$FFPROBE"
          cp "$FFMPEG" stage/All-Download/Donnees/bin/ffmpeg
          cp "$FFPROBE" stage/All-Download/Donnees/bin/ffprobe
          chmod +x stage/All-Download/Donnees/bin/{yt-dlp,ffmpeg,ffprobe}
          stage/All-Download/Donnees/bin/yt-dlp --version
          stage/All-Download/Donnees/bin/ffmpeg -version | head -n 1
      - name: Real localhost audio download and FFmpeg conversion
        env:
          ALL_DOWNLOAD_LINUX_E2E: "1"
          ALL_DOWNLOAD_LINUX_BIN: ${{ github.workspace }}/stage/All-Download/Donnees/bin
        run: python -m unittest discover -s linux/tests -p 'test_download_e2e.py' -v
      - name: Package native Linux interface
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name All-Download-Linux \
            --paths . --paths linux \
            --add-data "linux/ui.html:." \
            --collect-submodules webview \
            linux/app.py
          cp -a dist/All-Download-Linux/. stage/All-Download/
          for kind in AUDIOS VIDÉOS TWITCH GIFS CHAÎNES PLAYLIST AUTRES; do
            mkdir -p "stage/All-Download/$kind"
          done
          chmod +x stage/All-Download/All-Download-Linux
          test -x stage/All-Download/All-Download-Linux
          test -s stage/All-Download/Donnees/bin/yt-dlp
          test -s stage/All-Download/Donnees/bin/ffmpeg
      - name: Validate Qt window startup under Xvfb
        env:
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu"
        run: |
          cd stage/All-Download
          timeout 120 xvfb-run -a ./All-Download-Linux --smoke-ui
      - name: Archive and checksum
        run: |
          tar -C stage -czf All-Download-Linux-x86_64.tar.gz All-Download
          sha256sum All-Download-Linux-x86_64.tar.gz > All-Download-Linux-x86_64.tar.gz.sha256
          test -s All-Download-Linux-x86_64.tar.gz
          tar -tzf All-Download-Linux-x86_64.tar.gz | grep -Fx 'All-Download/All-Download-Linux'
          tar -tzf All-Download-Linux-x86_64.tar.gz | grep -Fx 'All-Download/Donnees/bin/yt-dlp'
      - name: Upload verified Linux beta archive
        uses: actions/upload-artifact@v4
        with:
          name: All-Download-Linux-x86_64
          path: |
            All-Download-Linux-x86_64.tar.gz
            All-Download-Linux-x86_64.tar.gz.sha256
      - name: Publish separate Linux beta Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="linux-v0.1.0-beta"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Linux $TAG already exists. Existing assets are preserved."
            exit 0
          fi
          gh release create "$TAG" \
            All-Download-Linux-x86_64.tar.gz \
            All-Download-Linux-x86_64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "All-Download Linux 0.1.0-beta (x86_64)" \
            --notes "Première préversion Linux. Interface HTML Windows identique; backend Linux Qt / yt-dlp / FFmpeg natif. Décompressez dans un dossier en écriture puis lancez All-Download-Linux. Linux x86_64 glibc avec session graphique. TwitchDownloaderCLI.exe Windows non inclus. Consultez linux/README.md." \
            --prerelease

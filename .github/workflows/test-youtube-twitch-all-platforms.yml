name: YouTube and Twitch public download diagnostics (Windows Android Linux)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/test_public_youtube_twitch.py"
      - ".github/workflows/test-youtube-twitch-all-platforms.yml"
      - "android/app/src/androidTest/java/com/alldownload/android/PublicVideoDownloadTest.kt"

permissions:
  contents: read

concurrency:
  group: youtube-twitch-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-live-probes:
    name: Real public video diagnostics - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-24.04
    steps:
      - name: Checkout production sources and test script
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable current YouTube JavaScript runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install real native yt-dlp and FFmpeg on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          curl -fL --retry 3 --connect-timeout 20 \
            -o yt-dlp-native https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x yt-dlp-native
          ./yt-dlp-native --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          deno --version
      - name: Install real native yt-dlp and FFmpeg on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'yt-dlp-native.exe'
          if (-not (Get-Command ffprobe.exe -ErrorAction SilentlyContinue) -or -not (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri 'https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
            Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg-unpacked"
            $bin = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg-unpacked" -Filter ffprobe.exe -Recurse | Select-Object -First 1).DirectoryName
            if (-not $bin) { throw 'ffprobe.exe introuvable' }
            Add-Content -Path "$env:GITHUB_PATH" -Value $bin
            $env:PATH = "$bin;$env:PATH"
          }
          ./yt-dlp-native.exe --version
          ffprobe -version | Select-Object -First 1
          deno --version
      - name: Public YouTube and Twitch metadata + real playable file
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = windows ]; then TOOL=./yt-dlp-native.exe; else TOOL=./yt-dlp-native; fi
          python .github/scripts/test_public_youtube_twitch.py --platform "$PLATFORM" \
            --yt-dlp "$TOOL" --json-out "youtube-twitch-$PLATFORM.json"
      - name: Preserve explicit PASS/BLOCKED/ERROR report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-youtube-twitch-${{ matrix.platform }}
          path: youtube-twitch-${{ matrix.platform }}.json
          if-no-files-found: ignore

  android-real-app:
    name: Android 14 actual app service - public YouTube + Twitch
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Allow Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test real YouTube via app foreground service and Twitch clip/VOD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            gradle --no-daemon -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.alldownload.android.PublicVideoDownloadTest#youtubeDownloadsThroughAppAndExportsPlayably,com.alldownload.android.PublicVideoDownloadTest#twitchClipCanDownloadShortVideoSection,com.alldownload.android.PublicVideoDownloadTest#twitchVodNativeSectionCanDownload
      - name: Describe test outcomes without treating skips as successes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          names = ('youtubeDownloadsThroughAppAndExportsPlayably',
                   'twitchClipCanDownloadShortVideoSection',
                   'twitchVodNativeSectionCanDownload')
          found = {}
          for path in glob.glob('android/app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  name = case.get('name', '')
                  if name not in names: continue
                  if case.find('failure') is not None:
                      outcome = 'FAIL'
                      reason = case.find('failure').get('message', '')
                  elif case.find('skipped') is not None:
                      outcome = 'BLOCKED / SKIPPED (no verified download)'
                      reason = case.find('skipped').get('message', '')
                  else:
                      outcome, reason = 'PASS', 'No failures; media verified by test'
                  found[name] = (outcome, reason[:220].replace('|', '/').replace('\n', ' '))
          print('Actual Android YouTube and Twitch network verification:')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as f:
              f.write('### Android 14: actual app public video checks\n')
              f.write('| Test | Result | Notes |\n|---|---|---|\n')
              for name in names:
                  outcome, reason = found.get(name, ('NOT RUN', 'No instrumentation XML result'))
                  line = f'| {name} | {outcome} | {reason} |\n'
                  print(line.strip())
                  f.write(line)
              f.write('\nA skipped/restricted media download is not a successful download.\n')
          if not found:
              print('::error::No Android YouTube/Twitch instrumentation results produced.')
              raise SystemExit(1)
          PY
      - name: Save Android instrumentation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-youtube-twitch-android
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

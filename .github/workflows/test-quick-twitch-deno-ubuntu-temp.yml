name: Test rapide multi-plateforme Twitch Deno (temporaire)

on:
  pull_request:
    paths:
      - ".github/workflows/test-quick-twitch-deno-ubuntu-temp.yml"

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Dépendances sans interface graphique
        run: python -m pip install pywebview==6.2.1 psutil
      - name: Syntaxe Python de tous les modules
        run: python -m py_compile yt_app.py twitch_vod.py twitch_hls.py deno_runtime.py
      - name: Tests Twitch et Deno (hors réseau)
        run: python -m unittest discover -s tests -p 'test_twitch*.py' -v && python -m unittest discover -s tests -p 'test_deno_runtime.py' -v && python -m unittest discover -s tests -p 'test_settings_responsive.py' -v

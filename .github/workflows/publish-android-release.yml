name: Publish All-Download Android beta

on:
  push:
    branches: [main, feature/android-app]
    paths:
      - "android/app/src/main/**"
      - "android/app/src/androidTest/**"
      - "android/app/src/test/**"
      - "android/app/build.gradle.kts"
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: all-download-android-beta-release
  cancel-in-progress: true

jobs:
  release-android:
    name: Verify, package and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Android beta branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exiger compilation, tests téléphone/tablette, vidéos et réseaux sociaux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TESTED_SHA="$(git log -1 --format=%H -- android/)"
          test -n "$TESTED_SHA"
          echo "Version du code Android : $TESTED_SHA"
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n1)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta)?$ ]]; then
            echo "Nom de version Android invalide : $VERSION"
            exit 1
          fi
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release Android ciblée : android-v$VERSION"
          validated=0
          for attempt in $(seq 1 100); do
            LATEST="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/${{ github.ref_name }}" --jq '.object.sha')"
            if [ "$LATEST" != "$GITHUB_SHA" ]; then
              echo "Code Android modifié depuis le début des tests : ancienne publication annulée."
              exit 1
            fi
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")"
            validated=0
            for name in "Build and test Android (beta)" "Android public video download checks" "Android social media video checks"; do
              state="$(printf '%s' "$runs" | jq -r --arg name "$name" --arg sha "$TESTED_SHA" \
                '[.workflow_runs[] | select(.name==$name and .head_sha==$sha)] | .[0].conclusion // "pending"')"
              if [ "$state" = "failure" ] || [ "$state" = "cancelled" ]; then
                echo "Suite Android non réussie : $name => $state"
                exit 1
              fi
              if [ "$state" = "success" ]; then validated=$((validated + 1)); fi
              if [ $((attempt % 5)) -eq 1 ]; then echo "$name : $state"; fi
            done
            if [ "$validated" = "3" ]; then
              echo "Toutes les suites Android vérifiées pour $TESTED_SHA"
              echo "ANDROID_VERIFIED_SHA=$TESTED_SHA" >> "$GITHUB_ENV"
              break
            fi
            if [ "$attempt" = "100" ]; then
              echo "Tests Android incomplets : aucune publication."
              exit 1
            fi
            sleep 12
          done
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and APK build
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Sign with a permanent private Android release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configurez les 4 secrets Android Actions dans android/SIGNING.md. Publication bloquée : aucune APK de débogage ne sera diffusée."
            exit 1
          fi
          if [ "$ANDROID_KEY_ALIAS" = "androiddebugkey" ]; then
            echo "::error::La clé Android Debug est interdite pour une Release."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/all-download-release.p12"
          ALIGNED="$RUNNER_TEMP/all-download-aligned.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$SRC"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$SRC" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release-signed.apk
          echo "APK_SIGNING=stable" >> "$GITHUB_ENV"
          echo "Signature Android permanente validée."
      - name: Validate APK and prepare release file
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/release/app-release-signed.apk"
          DEST="All-Download-Android-${ANDROID_VERSION}.apk"
          test -s "$SRC"
          unzip -tq "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SRC"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          if ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | grep -q "versionName='${ANDROID_VERSION}'"; then
            echo "Wrong Android version in the APK"
            exit 1
          fi
          cp "$SRC" "$DEST"
          sha256sum "$DEST" | tee "${DEST}.sha256"
      - name: Write release notes
        run: |
          cat > android-release-notes.md <<'EOF'
          ## All-Download Android {{VERSION}} — édition stable

          **Version Android 1.0 :** partage natif depuis YouTube, Twitch, TikTok, Reddit, Instagram,
          navigateurs et autres applications proposant une URL HTTP(S), avec lien prérempli
          et démarrage volontaire du téléchargement. Partage multiple de liens : ajout à la file.
          **Partage de fichiers vidéo locaux :** via Galerie/Fichiers/Partager, transfert en streaming
          de un à douze fichiers vers Téléchargements/All-Download/VIDÉOS sans supprimer les originaux.
          Import conservateur : formats vidéo reconnus, sources content:// uniquement,
          copie en blocs de 64 Kio, nettoyage du fichier de sortie en cas d’échec.

          - Windows et Linux inchangés par ce code Android.
          - Qualité automatique : meilleure source native disponible, sans plafond 1080p.
          - Twitch : secours HLS natif après un échec du moteur principal.
          - Réglages mobiles : logos et textes rapprochés et alignés au début de la ligne.
          - Android 7+, téléphone, tablette et écrans pliables.
          - Boutons, thèmes Clair/Sombre/OLED, menus et file persistante conservés.
          - Mise à jour intégrée : APK privée vérifiée SHA-256/signature et installateur officiel Android.
          - Passage bêta → stable : versionCode croissant, signature de publication identique requise.
          - Téléchargements YouTube/Twitch et qualité native selon formats réellement disponibles.
          - La compatibilité de chaque site externe dépend du site et de ses protections.
          - Certains médias TikTok peuvent changer de format et certains HLS Dailymotion
            exigent une émulation Firefox/Chrome non incluse sur Android.
          - Les échecs externes sont classés non concluants (SKIP) et jamais PASS sans média.
          - Tests automatisés : Android 9, 14, 15, tablette Android 14, qualité des transferts
            et paramètres/interaction/mises à jour.
          - Aucune installation silencieuse : une autorisation du système peut être nécessaire.
          - La clé privée de signature doit rester sauvegardée séparément du dépôt.

          Consultez android/README.md et docs/MAINTENANCE.md pour les limites et la restauration.
          EOF
          sed -i "s/{{VERSION}}/$ANDROID_VERSION/g" android-release-notes.md
      - name: Publish Android release without replacing Windows latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v${ANDROID_VERSION}"
          APK="All-Download-Android-${ANDROID_VERSION}.apk"
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/${{ github.ref_name }}" --jq '.object.sha')"
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "Publication refusée : la branche Android a changé."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            previous="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')"
            previous_source="$(git log -1 --format=%H "$previous" -- android/)"
            if [ "$previous_source" != "$ANDROID_VERIFIED_SHA" ]; then
              echo "La version $TAG existe déjà pour un autre code. Incrémenter versionCode et versionName avant une nouvelle release."
              exit 1
            fi
            echo "APK Android déjà publié pour le même code : fichier et empreinte conservés."
          else
            flags=(--latest=false)
            if [[ "$ANDROID_VERSION" == *-beta ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "$APK" "${APK}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "All-Download Android ${ANDROID_VERSION}" \
              --notes-file android-release-notes.md "${flags[@]}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,isPrerelease,assets --jq '{url,isPrerelease,assets:[.assets[].name]}'
          expected_prerelease=false
          if [[ "$ANDROID_VERSION" == *-beta ]]; then expected_prerelease=true; fi
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "$expected_prerelease"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$APK"

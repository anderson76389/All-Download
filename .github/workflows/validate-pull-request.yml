name: Vérifier les corrections proposées (sans publication)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer les dépendances minimales
        shell: pwsh
        run: |
          python -m pip install pywebview==6.2.1 pythonnet==3.2.1 "psutil>=6.1,<8"
      - name: Vérifier la syntaxe Python
        run: python -m py_compile yt_app.py
      - name: Tester tous les comportements Python
        run: python -m unittest discover -s tests -v
      - name: Tester les boutons JavaScript (sans créer de Release)
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'import yt_app; from pathlib import Path; Path("tests/ui-test.html").write_text(yt_app.HTML_PAGE, encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_ui_buttons.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_ui_responsive.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Télécharger et exécuter le vrai moteur Deno Windows x64
        run: python -m scripts.verify_deno_runtime
      - name: Construire une version Portable de prévisualisation
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/patch_webview_startup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --clean --noconfirm --workpath build/twitch-preview --distpath preview-build All_Media_Download-Portable.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = "preview/All-Download-Preview"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "preview-build/All_Media_Download.exe" "$root/All_Media_Download.exe"
          Copy-Item "logo.ico" "$root/logo.ico"
          Copy-Item "logo.jpg" "$root/logo.jpg"
          foreach ($dir in @("AUDIOS", "AUTRES", "CHAÎNES", "GIFS", "PLAYLIST", "VIDÉOS")) {
            New-Item -ItemType Directory -Force -Path "$root/$dir" | Out-Null
          }
      - name: Déposer le programme de test sans publier de Release
        uses: actions/upload-artifact@v4
        with:
          name: All-Download-Twitch-Preview-Windows
          path: preview/All-Download-Preview/
          retention-days: 7

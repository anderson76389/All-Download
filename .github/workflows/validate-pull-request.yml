name: Vérifier les corrections proposées (sans publication)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer les dépendances minimales
        shell: pwsh
        run: |
          python -m pip install pywebview==6.2.1 pythonnet==3.2.1 "psutil>=6.1,<8"
      - name: Vérifier la syntaxe Python
        run: python -m py_compile yt_app.py
      - name: Tester tous les comportements Python
        run: python -m unittest discover -s tests -v
      - name: Tester les boutons JavaScript (sans créer de Release)
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'import yt_app; from pathlib import Path; Path("tests/ui-test.html").write_text(yt_app.HTML_PAGE, encoding="utf-8")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_ui_buttons.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_ui_responsive.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Check desktop resource lifecycle (no release)
on:
  pull_request:
    paths:
      - "yt_app.py"
      - "tests/**"
      - ".github/workflows/test-resource-lifecycle.yml"
  push:
    branches:
      - "fix/android-share-shutdown-windows-cleanup-20261112"
permissions:
  contents: read
jobs:
  desktop-resource-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pywebview==6.2.1 pythonnet==3.2.1 "psutil>=6.1,<8"
      - run: python -m py_compile yt_app.py
      - run: python -m unittest discover -s tests -v

name: Offline recovery and release integrity tests
on:
  pull_request:
    paths:
      - "scripts/offline_backup.py"
      - "tests/test_offline_backup.py"
      - "tests/test_release_asset_integrity.py"
      - "tests/test_monitor_upstreams.py"
      - "scripts/monitor_upstreams.py"
      - "scripts/verify_release_asset.py"
      - ".github/workflows/test-offline-recovery.yml"
  push:
    branches: [main]
    paths:
      - "scripts/offline_backup.py"
      - "tests/test_offline_backup.py"
      - ".github/workflows/test-offline-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/offline_backup.py tests/test_offline_backup.py
      - run: python -m unittest discover -s tests -p test_offline_backup.py -v
      - run: python -m unittest discover -s tests -p test_release_asset_integrity.py -v
      - run: python -m unittest discover -s tests -p test_monitor_upstreams.py -v
